# School Closures Watch Worker. Deployed 2026-09-15 (D1 school-closures-watch, cron kept). Local dev: `wrangler dev --local`.
# Secrets: ADMIN_TOKEN (wrangler secret put). Vars below must stay off in production.
name = "school-closures-watch"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "school-closures-watch"
database_id = "e3225d47-8c6e-4a0a-9cfb-2b8656c46e61"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[vars]
SOURCE_ORIGIN_MAP = ""
ALLOW_FAKE_NOW = "0"
